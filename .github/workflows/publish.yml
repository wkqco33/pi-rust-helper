name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Deliberately no `registry-url`: `actions/setup-node` writes an
      # `_authToken=${NODE_AUTH_TOKEN}` line that expands to empty and makes npm
      # attempt token auth instead of the OIDC exchange, which then fails with
      # ENEEDAUTH/E404.
      - name: Upgrade npm for Trusted Publishing
        run: npm install --global npm@latest
      - name: Show runtime versions
        run: node --version && npm --version
      - name: Verify version matches tag
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [[ "$version" != "${GITHUB_REF_NAME}" ]]; then
            echo "package.json version $version does not match release tag ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Verify release
        run: npm run check
      # A tag can legitimately point at a version that is already on npm (the
      # first version of a package cannot be published through trusted
      # publishing, so it is uploaded by hand before the publisher is
      # configured). Re-running the release job must therefore be a no-op
      # instead of an EPUBLISHCONFLICT.
      - name: Check whether this version is already published
        id: published
        shell: bash
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} is already on npm; the publish step will be skipped."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with npm Trusted Publishing
        if: steps.published.outputs.already != 'true'
        run: npm publish --provenance --access public
