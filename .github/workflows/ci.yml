name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Check (tests, types, format, docs, package contents)
        run: npm run check
      - name: Capture the package manifest
        if: always() && matrix.node == 22
        run: npm pack --dry-run --json > pack.json
      - name: Upload package manifest
        if: always() && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: npm-pack-manifest
          path: pack.json

  no-rust:
    name: cargo-free path
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The Rust-dependent tests must report an explicit skip, not a silent pass.
      # The runner ships a Rust toolchain, so absence is asserted through the
      # harness override instead of by removing cargo.
      - name: Run the suite with the toolchain assumed absent
        env:
          PI_RUST_HELPER_NO_RUST: '1'
        run: |
          npx tsx --test test/regression.test.ts | tee no-rust.txt
          grep -Eq 'skipped [1-9]' no-rust.txt

  contract:
    name: Envelope and false-green contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # These carry the reason the helper exists: one keeps the shared envelope
      # whole at the tool boundary, the other keeps the measured false green
      # (default-members, zero tests, skipped doctests) detectable.
      - name: Contract enforced
        run: |
          npx tsx --test test/tools.test.ts
          npx tsx --test test/regression.test.ts

  extension-smoke:
    name: pi extension smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pi CLI
        run: npm install --global @earendil-works/pi-coding-agent
      - name: Load extension
        run: pi -e ./extensions/index.ts --list-models
